name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 更新pip，安装全部依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller打包成EXE
        run: |
          # GUI程序，不带黑窗口用下面一行
          pyinstaller -F -w V4_1.py --noconfirm
          # 如果是控制台程序，删掉 -w
          # pyinstaller -F V4_1.py --noconfirm

      - name: 上传打包好的exe文件作为产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-result
          path: dist/*.exe
